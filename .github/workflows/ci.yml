# CI workflow for the feature/3.0.x line (JDK 21)
#
# Triggers:
#   - push / pull_request on the feature/3.0.x branch
#   - manual workflow_dispatch
#
# Runs `./mvnw -B clean verify` which includes the JaCoCo coverage gate
# (90% line coverage, haltOnFailure=false) configured in the POM.
name: CI

on:
  push:
    branches: [feature/3.0.x]
  pull_request:
    branches: [feature/3.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Easy4J snapshot dependencies
        env:
          EASY4J_BRANCH: ${{ github.base_ref || github.ref_name }}
          EASY4J_DEPENDENCIES: "jwt-issuer shiro-extension"
        run: |
          set -euo pipefail
          dependency_root="${RUNNER_TEMP}/easy4j-dependencies"
          mkdir -p "${dependency_root}"
          for dependency in ${EASY4J_DEPENDENCIES}; do
            case "${dependency}" in
              jwt-issuer) pinned_sha="c5873ed3d450f1900dcbf2a4fc2e590077d233f7" ;;
              shiro-extension) pinned_sha="2080957579216003a10c36044d312745ae587686" ;;
              *) echo "Unexpected dependency: ${dependency}" >&2; exit 1 ;;
            esac
            git clone --depth 1 --branch "${EASY4J_BRANCH}" \
              "https://github.com/easy-4-java/${dependency}.git" \
              "${dependency_root}/${dependency}"
            git -C "${dependency_root}/${dependency}" fetch --depth 1 origin "${pinned_sha}"
            git -C "${dependency_root}/${dependency}" checkout --detach FETCH_HEAD
            echo "Pinned ${dependency} at $(git -C "${dependency_root}/${dependency}" rev-parse HEAD)"
            for attempt in 1 2 3; do
              if (cd "${dependency_root}/${dependency}" && \
                bash ./mvnw -B --no-transfer-progress \
                -DskipTests -Djacoco.skip=true -Dgpg.skip=true install); then
                break
              fi
              if [[ "${attempt}" -eq 3 ]]; then
                exit 1
              fi
              sleep "$((attempt * 10))"
            done
          done

      - name: Record resolved framework dependency tree
        run: ./mvnw -B --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dincludes=org.apache.shiro,org.springframework,jakarta.servlet,javax.servlet

      - name: Build and verify with JaCoCo coverage gate
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
